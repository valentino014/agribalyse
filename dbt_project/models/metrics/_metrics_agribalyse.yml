    description: Nombre de produit distinct.
    type: simple
    type_params:
      measure: nb_produit
  - name: somme_score_unique_ef_par_kg_de_produit
    label: Somme score unique
    description: Somme de score unique ef par kg de produit.
    type: simple
    type_params:
      measure: somme_score_unique_ef_par_kg_produit
